name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  code-quality-and-tests:
    name: Code Quality, Security & Automated Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: anywhereroles_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, bcmath, gd, curl, zip, dom, xml, libxml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Check Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Security Vulnerability Scan (Composer & NPM)
        run: |
          composer audit
          npm audit --audit-level=high

      - name: Setup Environment & Run Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: anywhereroles_test
          DB_USERNAME: root
          DB_PASSWORD: root
          APP_KEY: base64:6C7zPqjZ61K89lVp6GqXW6M7XbI7k8P6z1A9q0W7X2Y=
        run: |
          cp .env.example .env
          php artisan migrate --force

      - name: Run Automated Test Suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: anywhereroles_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      - name: Build Frontend Assets with Vite
        run: |
          npm ci
          npm run build

  deploy-production:
    name: Zero-Downtime Production Deployment
    needs: code-quality-and-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/anywhereroles
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
            sudo systemctl reload php8.2-fpm
